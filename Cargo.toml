[package]
name = "dz6-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Model Context Protocol server for the dz6 hex editor"
license = "GPL-3.0-or-later"
repository = "https://github.com/halencarjunior/dz6-mcp"
keywords = ["mcp", "hex-editor", "reverse-engineering", "dz6"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dz6-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dz6 = { path = "../dz6" }
goblin = "0.10.5"
hex = "0.4.3"
memchr = "2.7.4"
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
